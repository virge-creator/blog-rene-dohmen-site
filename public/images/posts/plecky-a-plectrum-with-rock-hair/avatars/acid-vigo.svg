  <!-- Plecky "Rocker" (Rock), generated by scripts/make_plecky.py. Parts: classic body, scribble hair, round eyes, grin mouth, glove hands, sneaker feet. -->
  <!--
  PLECKY AVATAR TEMPLATE. Keep this 400 x 520 canvas, pick point down, feet on the ground line (y 498).
  Draw in place inside the ten layers, named exactly: hair_back, body, eyes, mouth, accessories, hair,
  hand_l, hand_r, foot_l, foot_r (a group id, an Inkscape layer name or an Illustrator layer name all work).
  The rig moves each layer on its own: body squashes and leans around the pick tip, hair bounces from its
  pivot, hands float, feet step. Draw hand_l and foot_l pointing right; leave hand_r and foot_r out to have
  them mirrored, or draw them yourself. Paths, fills, strokes, gradients and clip paths render; text, filters,
  patterns and bitmaps do not (convert text to paths). Save as game/assets/plecky/custom/<genre>-<name>.svg
  and run scripts/make_plecky.py: the avatar appears in the menu's Avatar row and the gallery.
  -->
